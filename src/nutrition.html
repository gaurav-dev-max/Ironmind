    <!-- TAB 2: NUTRITION & MACROS -->
    <div id="panel-fuel" class="view-panel">
      
      <!-- CIRCULAR DASHBOARD SUMMARY -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="card-label">Daily Nutrient Rings</span>
          <span id="cal-remaining" style="font-family:var(--font-mono); font-size:0.75rem; color:var(--text-muted);">0 left</span>
        </div>

        <div class="rings-grid">
          <!-- CALORIES RING -->
          <div class="ring-wrapper">
            <div class="circle-progress" id="ring-cal">
              <div class="circle-inner">
                <span class="circle-percent" id="pct-cal">0%</span>
              </div>
            </div>
            <span class="ring-label">Calories</span>
            <span class="ring-sub" id="cal-consumed">0</span>
          </div>

          <!-- PROTEIN RING -->
          <div class="ring-wrapper">
            <div class="circle-progress" id="ring-pro">
              <div class="circle-inner">
                <span class="circle-percent" id="pct-pro">0%</span>
              </div>
            </div>
            <span class="ring-label">Protein</span>
            <span class="ring-sub"><span id="p-consumed">0</span>g</span>
          </div>

          <!-- CARBS RING -->
          <div class="ring-wrapper">
            <div class="circle-progress" id="ring-carb">
              <div class="circle-inner">
                <span class="circle-percent" id="pct-carb">0%</span>
              </div>
            </div>
            <span class="ring-label">Carbs</span>
            <span class="ring-sub"><span id="c-consumed">0</span>g</span>
          </div>

          <!-- FATS RING -->
          <div class="ring-wrapper">
            <div class="circle-progress" id="ring-fat">
              <div class="circle-inner">
                <span class="circle-percent" id="pct-fat">0%</span>
              </div>
            </div>
            <span class="ring-label">Fats</span>
            <span class="ring-sub"><span id="f-consumed">0</span>g</span>
          </div>
        </div>
      </div>

      <!-- EDITABLE TARGETS -->
      <div class="card">
        <span class="card-label">Daily Targets (Tap to Edit)</span>
        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-top:8px;">
          <div>
            <div style="font-size:0.65rem; color:var(--text-muted); font-weight:700;">CAL</div>
            <input type="number" id="in-target-calories" value="2800" style="padding:6px; font-size:0.8rem; text-align:center;">
          </div>
          <div>
            <div style="font-size:0.65rem; color:var(--text-muted); font-weight:700;">PRO (g)</div>
            <input type="number" id="in-target-protein" value="180" style="padding:6px; font-size:0.8rem; text-align:center;">
          </div>
          <div>
            <div style="font-size:0.65rem; color:var(--text-muted); font-weight:700;">CARB (g)</div>
            <input type="number" id="in-target-carbs" value="320" style="padding:6px; font-size:0.8rem; text-align:center;">
          </div>
          <div>
            <div style="font-size:0.65rem; color:var(--text-muted); font-weight:700;">FAT (g)</div>
            <input type="number" id="in-target-fats" value="75" style="padding:6px; font-size:0.8rem; text-align:center;">
          </div>
        </div>
      </div>

      <!-- SMART MEAL DETECTOR -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="card-label">Smart Meal Auto-Detector</span>
          <span id="detector-status" style="font-family:var(--font-mono); font-size:0.7rem; color:var(--emerald);">AI READY</span>
        </div>
        <input type="text" id="in-food-query" placeholder="e.g. 200g chicken or 4 eggs" style="margin-top:8px;">

        <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-top:8px;">
          <input type="number" id="in-meal-cal" placeholder="kcal">
          <input type="number" id="in-meal-pro" placeholder="prot (g)">
          <input type="number" id="in-meal-carb" placeholder="carb (g)">
          <input type="number" id="in-meal-fat" placeholder="fat (g)">
        </div>

        <button class="btn-action btn-emerald" id="btn-submit-meal" style="margin-top:10px;">
          + Log Detected Meal
        </button>
      </div>

      <!-- HYDRATION & RECOVERY -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="card-label">Hydration Monitor</span>
          <span id="water-display" style="font-family:var(--font-mono); font-weight:700; color:var(--cyan);">0 ml</span>
        </div>
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn-action" id="btn-water-250" style="flex:1;">+250 ml</button>
          <button class="btn-action" id="btn-water-500" style="flex:1;">+500 ml</button>
          <button class="btn-action" id="btn-water-reset" style="color:var(--rose); width:40px; padding:0;">✕</button>
        </div>
      </div>

      <!-- LOGGED MEALS FEED -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span class="card-label">Logged Fuel History</span>
          <button id="btn-clear-day" style="background:none; border:none; color:var(--rose); font-size:0.75rem; cursor:pointer;">Reset Day</button>
        </div>
        <div id="meals-feed" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>

    </div>
