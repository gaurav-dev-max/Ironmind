    <!-- TAB 1: STRENGTH HUB -->
    <div id="panel-gym" class="view-panel active">
      
      <!-- SPLIT SELECTION & TIME CAP -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span class="card-label">Training Split / Protocol</span>
          <button class="btn-action" id="btn-custom-day" style="width:auto; padding:4px 10px; font-size:0.75rem;">+ New Split</button>
        </div>
        <select id="split-selector"></select>

        <div style="display:flex; gap:6px; margin-top:8px;">
          <div class="badge-chip active" id="chip-time-free" style="flex:1;">Open Session</div>
          <div class="badge-chip" id="chip-time-45" style="flex:1;">45m Time-Cap</div>
          <div class="badge-chip" id="chip-time-60" style="flex:1;">60m Time-Cap</div>
        </div>

        <span class="card-label" style="display:block; margin-top:12px; margin-bottom:6px;">Recommended For Today (Tap to Add)</span>
        <div class="rec-scroll" id="recommendations-container"></div>
      </div>

      <!-- SESSION TELEMETRY -->
      <div class="telemetry-row">
        <div class="stat-card">
          <div class="card-label">Session Tonnage</div>
          <div class="stat-val" id="metric-tonnage" style="color:var(--emerald);">0 kg</div>
        </div>
        <div class="stat-card">
          <div class="card-label">Training Density</div>
          <div class="stat-val" id="metric-density" style="color:var(--cyan);">0 kg/m</div>
        </div>
      </div>

      <!-- REST & WORKOUT CLOCK -->
      <div class="card timer-card">
        <div class="timer-status" id="rest-status">REST TIMER • IDLE</div>
        <div class="timer-display" id="rest-clock">00:00</div>
        <div class="timer-btns">
          <button class="btn-timer" id="btn-rest-60">+60s</button>
          <button class="btn-timer" id="btn-rest-90">+90s</button>
          <button class="btn-timer" id="btn-rest-120">+120s</button>
          <button class="btn-timer btn-stop" id="btn-rest-stop">Stop</button>
        </div>
      </div>

      <!-- MOVEMENT CONTROLS -->
      <div class="card">
        <span class="card-label">Add Movement to Session</span>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <select id="manual-ex-select"></select>
          <button class="btn-action btn-emerald" id="btn-add-exercise" style="width:auto; white-space:nowrap; padding:0 14px;">+ Add Movement</button>
        </div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn-action" id="btn-open-plate" style="font-size:0.75rem; padding:8px;">🧮 Barbell Plates (Set 1)</button>
          <button class="btn-action" id="btn-calc-warmup" style="font-size:0.75rem; padding:8px; color:var(--cyan);">🔥 Warmup Pyramid</button>
        </div>
      </div>

      <!-- ACTIVE EXERCISE CARDS -->
      <div id="session-exercises-container" style="display:flex; flex-direction:column; gap:12px;"></div>

      <button class="btn-action btn-emerald" id="btn-commit" style="padding:14px; font-size:0.95rem; margin-top:6px;">
        Commit Training Session
      </button>

      <div style="display:flex; justify-content:center; gap:12px; margin-top:4px;">
        <button id="btn-export-json" style="background:none; border:none; color:var(--text-muted); font-size:0.75rem; cursor:pointer;">Backup Data (JSON)</button>
      </div>

    </div>
