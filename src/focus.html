    <!-- TAB 3: DEEP WORK & CA EXAM ENGINE -->
    <div id="panel-focus" class="view-panel">
      
      <!-- CA LEVEL & PAPER SELECTOR -->
      <div class="card">
        <span class="card-label">CA Paper & Syllabus Domain</span>
        <select id="focus-paper" style="margin-top:8px;">
          <optgroup label="CA Inter - Group 1">
            <option value="Advanced Accounting">Paper 1: Advanced Accounting</option>
            <option value="Corporate Laws">Paper 2: Corporate & Other Laws</option>
            <option value="Taxation">Paper 3: Taxation (DT & GST)</option>
          </optgroup>
          <optgroup label="CA Inter - Group 2">
            <option value="Cost & Management Accounting">Paper 4: Cost & Management Accounting</option>
            <option value="Auditing & Ethics">Paper 5: Auditing & Ethics</option>
            <option value="Financial Management">Paper 6A: Financial Management (FM)</option>
            <option value="Strategic Management">Paper 6B: Strategic Management (SM)</option>
          </optgroup>
          <optgroup label="CA Foundation / General">
            <option value="Accounting">Accounting Principles</option>
            <option value="Business Laws">Business Laws</option>
            <option value="Quantitative Aptitude">Quantitative Aptitude</option>
            <option value="Business Economics">Business Economics</option>
          </optgroup>
        </select>

        <div style="display:flex; gap:6px; margin-top:8px;">
          <div class="badge-chip active" id="chip-mode-practical" style="flex:1;">Practical / Numericals</div>
          <div class="badge-chip" id="chip-mode-theory" style="flex:1;">Theory & Case Law</div>
        </div>

        <input type="text" id="focus-anchor" placeholder="Specific Target (e.g. AS 115, Sec 44AD, PGBP, Audit Sampling...)" style="margin-top:8px;">
      </div>

      <!-- ICAI 3-HOUR / ULTRADIAN TIMER -->
      <div class="card timer-card">
        <div class="timer-status" id="focus-status" style="color:var(--gold);">ICAI READY • SITTING 1</div>
        <div class="timer-display" id="focus-clock" style="color:var(--gold);">25:00</div>
        
        <div class="timer-btns" style="flex-wrap:wrap;">
          <button class="btn-timer btn-gold" id="btn-focus-toggle">Start</button>
          <button class="btn-timer" id="btn-proto-15" title="ICAI Reading Window">15m Read</button>
          <button class="btn-timer" id="btn-proto-25">25m</button>
          <button class="btn-timer" id="btn-proto-90">90m Ultra</button>
          <button class="btn-timer btn-emerald" id="btn-proto-180" title="Full 3-Hour Exam Simulation">180m ICAI</button>
          <button class="btn-timer btn-stop" id="btn-focus-reset">Reset</button>
        </div>
      </div>

      <!-- TELEMETRY & ATTENTION STATS -->
      <div class="telemetry-row">
        <div class="stat-card">
          <div class="card-label">Daily Net Study</div>
          <div class="stat-val" id="metric-study-hours" style="color:var(--gold);">0.0 hrs</div>
        </div>
        <div class="stat-card">
          <div class="card-label">Attention Leaks</div>
          <div class="stat-val" id="metric-distractions" style="color:var(--rose);">0</div>
        </div>
      </div>

      <!-- SOUNDSCAPES & AUDIO -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="card-label">Cognitive Audio Frequency</span>
          <span id="audio-mode-label" style="font-family:var(--font-mono); font-size:0.7rem; color:var(--cyan);">OFF</span>
        </div>
        <button class="btn-action" id="btn-soundscape" style="margin-top:8px; font-size:0.8rem;">
          Toggle Frequency (White / Brown / 40Hz Gamma)
        </button>
      </div>

      <!-- ACTIVE RECALL & SPACED RETRIEVAL ANCHOR -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="card-label">Spaced Retrieval Queue (1-3-7-30)</span>
          <button class="btn-action" id="btn-add-provision" style="width:auto; padding:4px 8px; font-size:0.7rem; color:var(--emerald);">+ Anchor Topic</button>
        </div>
        <div id="revision-queue" style="margin-top:8px;"></div>
      </div>

    </div>
  </main>
