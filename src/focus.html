    <!-- TAB 3: DEEP WORK & FOCUS -->
    <div id="panel-focus" class="view-panel">
      <div class="card">
        <span class="card-label">Focus Objective / Subject</span>
        <input type="text" id="focus-objective" placeholder="e.g. Financial Reporting Ch 4, API Architecture..." style="margin-top:8px;">
      </div>

      <div class="card timer-card">
        <div class="timer-status" id="focus-status" style="color:var(--gold);">FOCUS TIMER • READY</div>
        <div class="timer-display" id="focus-clock" style="color:var(--gold);">25:00</div>
        <div class="timer-btns">
          <button class="btn-timer btn-gold" id="btn-focus-toggle">Start</button>
          <button class="btn-timer" id="btn-proto-25">25m</button>
          <button class="btn-timer" id="btn-proto-90">90m</button>
          <button class="btn-timer btn-stop" id="btn-focus-reset">Reset</button>
        </div>
      </div>

      <div class="telemetry-row">
        <div class="stat-card">
          <div class="card-label">Attention Leaks</div>
          <div class="stat-val" id="metric-distractions" style="color:var(--rose);">0</div>
        </div>
        <div class="stat-card" style="display:flex; flex-direction:column; justify-content:center; gap:4px;">
          <button class="btn-action" id="btn-soundscape" style="width:100%; font-size:0.75rem; padding:8px 4px;">
            Audio: OFF
          </button>
        </div>
      </div>
    </div>
  </main>
