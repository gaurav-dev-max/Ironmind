<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#09090b">
  <title>IronMind OS</title>
  <style>
    :root {
      --bg: #09090b;
      --surface: #141417;
      --surface-subtle: #1e1e24;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --emerald: #10b981;
      --gold: #f59e0b;
      --cyan: #06b6d4;
      --rose: #f43f5e;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background-color: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .brand { font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; }
    .brand span { color: var(--emerald); }
    .status-badge { font-family: var(--font-mono); font-size: 0.7rem; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--emerald); color: var(--emerald); padding: 2px 8px; border-radius: 4px; }
    main { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .view-panel { display: none; flex-direction: column; gap: 12px; }
    .view-panel.active { display: flex; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; }
    select, input[type="text"], input[type="number"] { width: 100%; background: var(--surface-subtle); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; user-select: text; }
    .inline-target-input { background: transparent !important; border: none !important; border-bottom: 1px dashed var(--cyan) !important; border-radius: 0 !important; padding: 0 !important; font-family: var(--font-mono) !important; font-weight: 800 !important; font-size: 1.8rem !important; color: var(--cyan) !important; width: 105px !important; display: inline-block; text-align: center; }
    .inline-macro-input { background: transparent !important; border: none !important; border-bottom: 1px dashed var(--border) !important; border-radius: 0 !important; padding: 0 !important; font-family: var(--font-mono) !important; font-weight: 700 !important; font-size: 1.05rem !important; width: 50px !important; display: inline-block; text-align: center; color: var(--text) !important; }
    .progress-bar-bg { background: var(--surface-subtle); height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }
    .macro-cards-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .macro-stat-box { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 6px; padding: 8px; text-align: center; }
    .macro-stat-val { font-family: var(--font-mono); font-size: 1.05rem; font-weight: 700; margin: 4px 0; display: flex; align-items: center; justify-content: center; gap: 2px; }
    .telemetry-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-card { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .stat-val { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 700; color: var(--emerald); margin-top: 4px; }
    .timer-card { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .timer-status { font-size: 0.7rem; letter-spacing: 0.1em; font-weight: 700; color: var(--text-muted); }
    .timer-display { font-family: var(--font-mono); font-size: 2.4rem; font-weight: 800; color: var(--text); }
    .timer-btns { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; width: 100%; margin-top: 4px; }
    .btn-timer { background: var(--surface-subtle); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-size: 0.8rem; padding: 8px 0; border-radius: 4px; cursor: pointer; }
    .btn-stop { color: var(--rose); border-color: rgba(244, 63, 94, 0.4); }
    .chip-scroll { display: flex; gap: 8px; overflow-x: auto; padding-top: 6px; padding-bottom: 2px; }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .rec-chip { background: var(--surface-subtle); border: 1px solid var(--border); padding: 6px 12px; border-radius: 16px; font-size: 0.75rem; white-space: nowrap; cursor: pointer; color: var(--emerald); font-weight: 600; }
    .exercise-block { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .ex-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .ex-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .set-list { display: flex; flex-direction: column; gap: 8px; }
    .set-row { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
    .set-top { display: flex; justify-content: space-between; align-items: center; }
    .set-tag { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700; color: var(--text-muted); }
    .set-1rm { font-family: var(--font-mono); font-size: 0.75rem; color: var(--emerald); }
    .steppers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .step-box { display: flex; align-items: center; justify-content: space-between; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; }
    .step-btn { background: var(--surface-subtle); border: 1px solid var(--border); color: var(--text); font-family: var(--font-mono); font-weight: 700; font-size: 0.95rem; width: 28px; height: 28px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .step-text { font-family: var(--font-mono); font-size: 0.9rem; font-weight: 700; }
    .btn-action { background: var(--surface-subtle); border: 1px solid var(--border); color: var(--text); font-weight: 600; font-size: 0.85rem; padding: 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-action:active { opacity: 0.8; }
    .btn-emerald { background: var(--emerald); color: #000; border: none; font-weight: 700; }
    .btn-gold { background: var(--gold); color: #000; border: none; font-weight: 700; }
    .btn-cyan { background: var(--cyan); color: #000; border: none; font-weight: 700; }
    .water-tracker { display: flex; justify-content: space-between; align-items: center; background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
    .meal-feed { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .meal-item { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; }
    .meal-meta { display: flex; flex-direction: column; gap: 2px; }
    .meal-title { font-weight: 600; font-size: 0.9rem; }
    .meal-details { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
    .modal-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
    .modal-backdrop.show { display: flex; }
    .modal-window { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 340px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .plate-output { background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.6; }
    .plate-output strong { color: var(--emerald); }
    #toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--surface); border: 1px solid var(--emerald); color: var(--text); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.6); transition: transform 0.25s ease; z-index: 2000; }
    #toast.show { transform: translateX(-50%) translateY(0); }
    nav { height: 58px; background: var(--surface); border-top: 1px solid var(--border); display: flex; flex-shrink: 0; }
    .nav-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); font-weight: 600; font-size: 0.75rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .nav-btn.active { color: var(--emerald); }
    .nav-btn.nav-fuel.active { color: var(--cyan); }
    .nav-btn.nav-focus.active { color: var(--gold); }
  </style>
</head>
<body>
  <div id="toast">✔ Operation Confirmed</div>
