<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IronMind OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --surface: #12141c;
      --surface-hover: #1a1d28;
      --border: #222634;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.2);
      --cyan: #06b6d4;
      --gold: #f59e0b;
      --rose: #f43f5e;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      width: 100%;
    }

    .brand {
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text);
    }

    .brand span {
      color: var(--emerald);
    }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 24px;
      min-height: 0;
    }

    .view-panel {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .view-panel.active {
      display: flex;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
    }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .telemetry-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .stat-val {
      font-family: var(--font-mono);
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .timer-card {
      text-align: center;
      padding: 16px 14px;
    }

    .timer-status {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .timer-display {
      font-family: var(--font-mono);
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.05em;
    }

    .timer-btns {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
    }

    .btn-timer {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-timer.btn-emerald {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    .btn-timer.btn-gold {
      background: rgba(245, 158, 11, 0.2);
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-timer.btn-stop {
      border-color: var(--rose);
      color: var(--rose);
    }

    .btn-action {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      text-align: center;
      width: 100%;
      cursor: pointer;
    }

    .btn-action.btn-emerald {
      background: var(--emerald);
      color: #000;
      border: none;
    }

    select, input[type="text"], input[type="number"] {
      width: 100%;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .rec-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 0;
    }

    .rec-chip {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      cursor: pointer;
    }

    .exercise-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ex-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ex-title {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .set-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .set-row {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .set-row.completed {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.08);
    }

    .set-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .set-meta-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .set-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--emerald);
    }

    .ghost-target {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--cyan);
      background: rgba(6, 182, 212, 0.1);
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px dashed rgba(6, 182, 212, 0.3);
    }

    .set-1rm {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .steppers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .step-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 4px;
    }

    .step-btn {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      width: 32px;
      height: 32px;
      cursor: pointer;
    }

    .step-text {
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    /* CIRCULAR METRIC RINGS */
    .rings-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0 6px 0;
    }

    .ring-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .circle-progress {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: conic-gradient(var(--emerald) 0deg, var(--surface-hover) 0deg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 0.3s ease;
    }

    .circle-progress::after {
      content: "";
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: var(--surface);
    }

    .circle-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .circle-percent {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text);
    }

    .ring-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .ring-sub {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    .meal-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .meal-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .meal-title {
      font-weight: 600;
      font-size: 0.85rem;
    }

    .meal-details {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* CA EXAM ENGINE BADGES & RETRIEVAL */
    .badge-chip {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      padding: 5px 8px;
      border-radius: 4px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .badge-chip.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(245, 158, 11, 0.15);
    }

    .revision-card {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
    }

    .provision-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--cyan);
      background: rgba(6, 182, 212, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-window {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .plate-output {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.5;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
    }

    nav {
      height: 60px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      flex-shrink: 0;
      z-index: 100;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--emerald);
    }

    .nav-icon {
      font-size: 1.1rem;
    }

    .nav-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    #toast {
      position: fixed;
      bottom: 74px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 8px 16px;
      border-radius: 20px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 2000;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
