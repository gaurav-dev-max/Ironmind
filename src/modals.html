  <!-- PLATE CALCULATOR MODAL -->
  <div class="modal-backdrop" id="modal-plate">
    <div class="modal-window">
      <div style="font-weight:700; font-size:0.95rem;">Barbell Plate Loading</div>
      <div class="plate-output" id="plate-summary">Calculating...</div>
      <button class="btn-action" id="btn-close-plate">Done</button>
    </div>
  </div>

  <!-- WARMUP PYRAMID MODAL -->
  <div class="modal-backdrop" id="modal-warmup">
    <div class="modal-window">
      <div style="font-weight:700; font-size:0.95rem;">Compound Warmup Schedule</div>
      <div class="plate-output" id="warmup-summary">Calculating...</div>
      <button class="btn-action btn-emerald" id="btn-close-warmup">Ready to Lift</button>
    </div>
  </div>

  <!-- CUSTOM SPLIT MODAL -->
  <div class="modal-backdrop" id="modal-split">
    <div class="modal-window">
      <div style="font-weight:700; font-size:0.95rem;">Create Custom Split</div>
      <input type="text" id="input-split-name" placeholder="Split Name (e.g. Pull Day)">
      <input type="text" id="input-split-recs" placeholder="Comma-separated (Deadlift, Lat Pulldown...)">
      <div style="display:flex; gap:8px; margin-top:4px;">
        <button class="btn-action btn-emerald" id="btn-save-split">Save Split</button>
        <button class="btn-action" id="btn-cancel-split">Cancel</button>
      </div>
    </div>
  </div>

  <div id="toast">Ready</div>
