  <!-- MODAL: BARBELL PLATE CALCULATOR -->
  <div class="modal-backdrop" id="modal-plate">
    <div class="modal-window">
      <div style="font-weight:700; font-size:0.95rem;">Olympic Plate Breakdown</div>
      <div style="font-size:0.8rem; color:var(--text-muted);">Standard 20kg Barbell Included</div>
      <div class="plate-output" id="plate-summary">Loading...</div>
      <button class="btn-action" id="btn-close-plate">Done</button>
    </div>
  </div>

  <!-- MODAL: CUSTOM SPLIT BUILDER -->
  <div class="modal-backdrop" id="modal-split">
    <div class="modal-window">
      <div style="font-weight:700; font-size:0.95rem;">Create Custom Training Split</div>
      <input type="text" id="input-split-name" placeholder="e.g. Arms & Calves">
      <input type="text" id="input-split-recs" placeholder="Recommendations (e.g. Barbell Curl, Skullcrusher, Calf Raise)">
      <div style="display:flex; gap:8px;">
        <button class="btn-action" id="btn-cancel-split" style="flex:1;">Cancel</button>
        <button class="btn-action btn-emerald" id="btn-save-split" style="flex:1;">Save</button>
      </div>
    </div>
  </div>
